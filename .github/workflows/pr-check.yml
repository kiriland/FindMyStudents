name: PR Build & Type Check

on:
  pull_request:
    branches:
      - main

jobs:
  validate-build:
    name: Build & Type Check
    runs-on: ubuntu-latest

steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Next.js Types
        run: npx next typegen

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Build & Prepare Standalone Artifact
        run: npm run prep:standalone