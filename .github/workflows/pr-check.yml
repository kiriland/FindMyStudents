name: PR Build, Lint, Format & Type Check

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate-build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/course-importer/package-lock.json

      - name: Install Dependencies
        run: npm ci

      # Type-aware lint resolves the importer's imports from its own node_modules.
      - name: Install Course Importer Dependencies
        run: npm ci --prefix services/course-importer

      - name: Generate Next.js Types
        run: npx next typegen

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Course Importer Type Check
        run: npm run typecheck --prefix services/course-importer

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Build & Prepare Standalone Artifact
        run: npm run prep:standalone
