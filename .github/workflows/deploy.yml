name: Deploy to AWS Lambda Web Functions

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install Dependencies
        run: npm ci

      - name: Build & Prepare Standalone Artifact
        env:
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_ALLOWED_HOSTNAMES: ${{ secrets.TURNSTILE_ALLOWED_HOSTNAMES }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run prep:standalone

      # The Web Function runs on arm64, but the build traces sharp's native
      # binaries for this x64 runner. Add the linux-arm64 (glibc) ones at the
      # locked sharp version, so profile pictures can be processed.
      - name: Add sharp binaries for Lambda arm64
        run: |
          SHARP_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/sharp'].version")
          npm install --prefix "$RUNNER_TEMP/sharp-arm64" --no-save --no-package-lock --no-audit --no-fund \
            --os=linux --cpu=arm64 --libc=glibc "sharp@$SHARP_VERSION"
          cp -R "$RUNNER_TEMP/sharp-arm64/node_modules/@img/sharp-linux-arm64" \
                "$RUNNER_TEMP/sharp-arm64/node_modules/@img/sharp-libvips-linux-arm64" \
                .next/standalone/node_modules/@img/
          test -f .next/standalone/node_modules/@img/sharp-linux-arm64/lib/sharp-linux-arm64-$SHARP_VERSION.node

      - name: Deploy to AWS Lambda Web Functions
        run: |
          aws lambda-web deploy \
            --name FindMyStudents \
            --code ./.next/standalone \
            --entry-point index.js \
            --endpoint-name production \
            --endpoint-type HomeRegion \
            --auto-deployment-mode LatestRevision \
            --region "us-east-1" \
            --execution-role-arn "${{ secrets.AWS_LAMBDA_EXECUTION_ROLE_ARN }}" \
            --env DYNAMODB_TABLE_NAME=${{ vars.DYNAMODB_TABLE_NAME }} \
            --env PROFILES_TABLE_NAME=${{ vars.PROFILES_TABLE_NAME }} \
            --env PROFILE_PICTURES_BUCKET_NAME=${{ vars.PROFILE_PICTURES_BUCKET_NAME }} \
            --env NEXT_PUBLIC_COGNITO_USER_POOL_ID=${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }} \
            --env NEXT_PUBLIC_COGNITO_CLIENT_ID=${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }} \
            --env NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }} \
            --env TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY}} \
            --env TURNSTILE_ALLOWED_HOSTNAMES=${{ secrets.TURNSTILE_ALLOWED_HOSTNAMES }} \
            --create